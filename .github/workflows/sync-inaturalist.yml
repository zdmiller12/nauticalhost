name: Sync iNaturalist

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run sync
        id: sync
        working-directory: site
        continue-on-error: true
        env:
          INATURALIST_APP_ID: ${{ secrets.INATURALIST_APP_ID }}
          INATURALIST_APP_SECRET: ${{ secrets.INATURALIST_APP_SECRET }}
          INATURALIST_USERNAME: ${{ secrets.INATURALIST_USERNAME }}
          INATURALIST_PASSWORD: ${{ secrets.INATURALIST_PASSWORD }}
        run: npm run sync-inaturalist

      # Runs even if "Run sync" failed partway through, so any observation IDs
      # it already wrote to disk (and thus already created on iNaturalist) get
      # committed rather than discarded -- otherwise the next scheduled run
      # would recreate them as duplicates.
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/src/content/photos
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync: refresh iNaturalist observation data"
            git push
          fi

      - name: Fail job if sync errored
        if: always() && steps.sync.outcome == 'failure'
        run: |
          echo "Sync step failed -- any successfully-written changes above were still committed." >&2
          exit 1
